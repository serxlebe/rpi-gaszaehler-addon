name: "RPi Gaszähler"
version: "1.0.0"
slug: "rpi_gaszaehler"
description: "Liest den Gasverbrauch über einen GPIO-Impulsgeber (Reed-Kontakt) am Raspberry Pi aus"
url: "https://github.com/serxlebe/rpi-gaszaehler"
arch:
  - aarch64
  - armv7
  - armhf
init: false
startup: application
boot: auto

# Gewährt dem Add-on Zugriff auf /dev/gpiomem, /dev/gpiochip*, /sys/class/gpio
# Ersetzt das manuelle Device-/udev-Mapping aus dem reinen Docker-Setup.
gpio: true

# Fordert MQTT-Zugangsdaten vom Supervisor an (z. B. vom Mosquitto-Add-on).
# Werden dem Container als Env-Variablen bereitgestellt, siehe run.sh.
services:
  - "mqtt:want"

options:
  gpio_pin: 22
  log_level: "info"

schema:
  gpio_pin: "int(0,27)"
  log_level: "list(trace|debug|info|warn|error)"
