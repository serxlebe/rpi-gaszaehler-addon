name: "RPi Gaszähler"
version: "1.0.3"
slug: "rpi_gaszaehler"
description: "Liest den Gasverbrauch über einen GPIO-Impulsgeber (Reed-Kontakt) am Raspberry Pi aus"
url: "https://github.com/serxlebe/rpi-gaszaehler"
arch:
  - aarch64
init: false
startup: application
boot: auto

# full_access statt gpio:true, weil rppal's Interrupt-Handling
# (set_interrupt/poll_interrupt) über ioctl auf /dev/gpiochip* läuft.
# gpio:true deckt nur /dev/gpiomem ab und wird zusätzlich vom AppArmor-
# Profil des Add-ons beim ioctl-Aufruf blockiert -> "Operation not
# permitted". full_access deaktiviert das AppArmor-Confinement und
# gibt vollen Gerätezugriff (schließt "devices:"/"gpio:" aus, daher
# hier nicht mehr gesetzt).
#full_access: true
gpio: true
privileged:
  - SYS_RAWIO
devices:
  - /dev/gpiomem:/dev/gpiomem:rwm
  - /dev/gpiochip0:/dev/gpiochip0:rwm
  - /dev/gpiochip4:/dev/gpiochip4:rwm

# Fordert MQTT-Zugangsdaten vom Supervisor an (z. B. vom Mosquitto-Add-on).
# Werden dem Container als Env-Variablen bereitgestellt, siehe run.sh.
services:
  - "mqtt:want"

options:
  gpio_pin: 23
  log_level: "info"

schema:
  gpio_pin: "int(0,27)"
  log_level: "list(trace|debug|info|warn|error)"
